spec: "1.0"
devices:
  device 1:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "Stanford_Research_Systems,SR860,000001,V1.51"
      - q: "CAPTURERATEMAX?"
        r: "1.25e6"
      - q: "ISRC?"
        r: "0"

    properties:
      capture_progress:
        default: 12
        getter:
          q: "CAPTUREPROG?"
          r: "{}"

resources:
  GPIB::1::INSTR:
    device: device 1
