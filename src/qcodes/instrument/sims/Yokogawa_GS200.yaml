spec: "1.0"
devices:
  device 1:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "QCoDeS Yokogawa Mock,GS200,xxxxxxxx,MOCKFW"
      - q: "*OPT?"
        r: "NO OPTIONS"
      # Status registers, see GS200 User's Manual IM GS210-01EN, 13.3.
      # *STB?: RQS (bit 6) and EAV (bit 2)
      - q: "*STB?"
        r: "68"
      # *ESR?: CME (bit 5)
      - q: "*ESR?"
        r: "32"
      # :STAT:EVEN?: EOP (bit 7) and SCG (bit 5)
      - q: ":STAT:EVEN?"
        r: "160"
      # :STAT:COND?: RFP (bit 8)
      - q: ":STAT:COND?"
        r: "256"

    properties:
      mode:
        default: "VOLT"
        getter:
          q: ":SOUR:FUNC?"
          r: "{}"
        setter:
          q: "SOUR:FUNC {}"
      output:
        default: 0
        getter:
          q: "OUTPUT?"
          r: "{}"
        setter:
          q: "OUTPUT {}"
      range:
        default: 10.0
        getter:
          q: ":SOUR:RANG?"
          r: "{:.6e}"
        setter:
          q: ":SOUR:RANG {}"
        specs:
          type: float
      level:
        default: 0.0
        getter:
          q: ":SOUR:LEV?"
          r: "{:.6e}"
        setter:
          q: ":SOUR:LEV {:e}"
        specs:
          type: float
      # pyvisa-sim cannot convert MIN/MAX to the step numbers 1/10000 as the
      # instrument does, so only set this to integers when reading it back.
      program_count:
        default: 1
        getter:
          q: ":PROG:COUN?"
          r: "{}"
        setter:
          q: ":PROG:COUN {}"
      auto_level:
        default: 0.0
        setter:
          q: ":SOUR:LEV:AUTO {:e}"
        specs:
          type: float



resources:
  GPIB::1::INSTR:
     device: device 1
