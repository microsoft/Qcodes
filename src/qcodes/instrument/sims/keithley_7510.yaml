# Simulated Keithley 7510 DMM instrument
spec: "1.0"
devices:
  device 1:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "KEITHLEY INSTRUMENTS, DMM7510, 01234567, 1.2.3a"

    properties:
      sense_function:
        default: "\"VOLT:DC\""
        getter:
          q: ":SENSe:FUNCtion?"
          r: "{}"
        setter:
          q: ":SENSe:FUNCtion {}"

      range_voltage:
        getter:
          q: ":SENSe:voltage:RANGe?"
          r: "{}"
        setter:
          q: ":SENSe:voltage:RANGe {}"

      nplc_voltage:
        getter:
          q: ":SENSe:voltage:NPLCycles?"
          r: "{}"
        setter:
          q: ":SENSe:voltage:NPLCycles {}"

      user_delay_1_voltage:
        default: 0
        getter:
          q: ":SENSe:voltage:DELay:USER1?"
          r: "{}"
        setter:
          q: ":SENSe:voltage:DELay:USER1 {}"
        specs:
          type: float

      average_count_voltage:
        default: 10
        getter:
          q: ":SENSe:voltage:AVERage:COUNt?"
          r: "{}"
        setter:
          q: ":SENSe:voltage:AVERage:COUNt {}"
        specs:
          type: int

      digitize_function:
        default: "\"VOLT\""
        getter:
          q: ":DIGitize:FUNCtion?"
          r: "{}"
        setter:
          q: ":DIGitize:FUNCtion {}"

      digitize_sample_rate_voltage:
        default: "1.000000E+06"
        getter:
          q: ":SENSe:DIGitize:voltage:SRATE?"
          r: "{}"
        setter:
          q: ":SENSe:DIGitize:voltage:SRATE {}"

      digitize_count:
        default: 10000
        getter:
          q: "SENSe:DIGitize:COUNt?"
          r: "{}"
        setter:
          q: "SENSe:DIGitize:COUNt {}"
        specs:
          type: int

      # command-only, no reply
      auto_zero_once:
        setter:
          q: ":SENSe:AZERo:ONCE"

      trigger_in_ext_clear:
        setter:
          q: ":TRIGger:EXTernal:IN:CLEar"

resources:
  "GPIB::1::INSTR":
    device: device 1
