spec: "1.0"
devices:
  device 1:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "QCoDeS Yokogawa Mock,GS200,xxxxxxxx,MOCKFW"
      - q: "*OPT?"
        r: "NO OPTIONS"
      # Status registers, see GS200 User's Manual IM GS210-01EN, 13.3.
      # *STB?: RQS (bit 6) and EAV (bit 2)
      - q: "*STB?"
        r: "68"
      # *ESR?: CME (bit 5)
      - q: "*ESR?"
        r: "32"
      # :STAT:EVEN?: EOP (bit 7) and SCG (bit 5)
      - q: ":STAT:EVEN?"
        r: "160"
      # :STAT:COND?: RFP (bit 8)
      - q: ":STAT:COND?"
        r: "256"
      # Only queried when *STB? reports EAV, so always return an error.
      - q: ":SYSTem:ERRor?"
        r: '-222,"Data out of range"'

    properties: &gs200_properties
      mode:
        default: "VOLT"
        getter:
          q: ":SOUR:FUNC?"
          r: "{}"
        setter:
          q: "SOUR:FUNC {}"
      output:
        default: 0
        getter:
          q: "OUTPUT?"
          r: "{}"
        setter:
          q: "OUTPUT {}"
      range:
        default: 10.0
        getter:
          q: ":SOUR:RANG?"
          r: "{:.6e}"
        setter:
          q: ":SOUR:RANG {}"
        specs:
          type: float
      level:
        default: 0.0
        getter:
          q: ":SOUR:LEV?"
          r: "{:.6e}"
        setter:
          q: ":SOUR:LEV {:e}"
        specs:
          type: float
      # pyvisa-sim cannot convert MIN/MAX to the step numbers 1/10000 as the
      # instrument does, so only set this to integers when reading it back.
      program_count:
        default: 1
        getter:
          q: ":PROG:COUN?"
          r: "{}"
        setter:
          q: ":PROG:COUN {}"
      auto_level:
        default: 0.0
        setter:
          q: ":SOUR:LEV:AUTO {:e}"
        specs:
          type: float
      # Measurement (/MON option) settings, only used by device 2
      measurement_enabled:
        default: 0
        getter:
          q: ":SENS?"
          r: "{}"
        setter:
          q: ":SENS {}"
      nplc:
        default: "+1.0E+00"
        getter:
          q: ":SENS:NPLC?"
          r: "{}"
        setter:
          q: ":SENS:NPLC {}"
      measurement_delay:
        default: "+0.0E+00"
        getter:
          q: ":SENS:DEL?"
          r: "{}"
        setter:
          q: ":SENS:DEL {}"
      measurement_trigger:
        default: "READ"
        getter:
          q: ":SENS:TRIG?"
          r: "{}"
        setter:
          q: ":SENS:TRIG {}"
      measurement_interval:
        default: "+0.5E+00"
        getter:
          q: ":SENS:INT?"
          r: "{}"
        setter:
          q: ":SENS:INT {}"

  # A GS200 with the /MON (monitoring) option
  device 2:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "QCoDeS Yokogawa Mock,GS200,xxxxxxxx,MOCKFW"
      - q: "*OPT?"
        r: "/MON"
      - q: ":MEAS?"
        r: "+1.23450E-03"

    properties: *gs200_properties

resources:
  GPIB::1::INSTR:
     device: device 1
  GPIB::2::INSTR:
     device: device 2
