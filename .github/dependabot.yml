version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  open-pull-requests-limit: 20
  rebase-strategy: "disabled"
  versioning-strategy: increase-if-necessary
  groups:
    zhinst:
      patterns:
        - "zhinst*"
    ipywidgets:
      patterns:
        - "ipywidgets"
        - "widgetsnbextension"
        - "jupyterlab-widgets"
    sphinx:
      patterns:
        - "sphinx"
        - "sphinxcontrib*"

- package-ecosystem: github-actions
  directory: "/"
  rebase-strategy: "disabled"
  groups:
    codeql:
      patterns:
        - "*codeql*"
  schedule:
    interval: "daily"


- package-ecosystem: npm
  directory: /.github
  schedule:
    interval: daily
  cooldown:
    default-days: 7


- package-ecosystem: "pre-commit"
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
