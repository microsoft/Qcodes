spec: "1.0"
devices:
  device 1:
    eom:
      GPIB INSTR:
        q: "\r\n"
        r: "\r\n"
    error: ERROR
    dialogues:
      - q: "GET O"
        r: "Overload: OFF"

    # replies follow the format that the driver parses
    properties:
      gain:
        default: "1E8"
        getter:
          q: "GET G"
          r: "Gain: {}"
        setter:
          q: "SET G {}"
          r: "OK"

      filter:
        default: "1k"
        getter:
          q: "GET F"
          r: "Filter: {}Hz"
        setter:
          q: "SET F {}"
          r: "OK"

resources:
  GPIB::1::INSTR:
    device: device 1
