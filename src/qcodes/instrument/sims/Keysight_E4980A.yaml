spec: "1.0"
devices:
  device 1:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*RST"
      - q: "*CLS"
      - q: "*OPT?"
        r: "001"
      - q: "*IDN?"
        r: "Keysight Technologies,E4980A,MY46516036,A.02.10"

    properties:

      voltage_level:
        default: 0
        getter:
          q: ":VOLTage:LEVel?"
          r: "{}"
        setter:
          q: ":VOLTage:LEVel {}"

      current_level:
        default: 0
        getter:
          q: ":CURRent:LEVel?"
          r: "{}"
        setter:
          q: ":CURRent:LEVel {}"

      impedance_range:
        # preset value according to the E4980A/AL user's guide
        default: "+1.00000E+02"
        getter:
          q: ":FUNCtion:IMPedance:RANGe?"
          r: "{}"
        setter:
          q: ":FUNCtion:IMPedance:RANGe {}"

      impedance_autorange:
        default: 1
        getter:
          q: ":FUNCtion:IMPedance:RANGe:AUTO?"
          r: "{}"
        setter:
          q: ":FUNCtion:IMPedance:RANGe:AUTO {}"

resources:
  GPIB::1::INSTR:
    device: device 1
