spec: "1.0"
devices:
  device 1:
    eom:
      ASRL INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "QCoDeS Mock,DPO72004C,xxxxxxxx,CF:91.1CT FV:10.8.3 Build 3"

    properties:
      horizontal_units:
        getter:
          q: "HORizontal:MAIn:UNIts?"
          r: "s"
        setter:
          q: "HORizontal:MAIn:UNIts {}"
      horizontal_mode:
        default: "MANUAL"
        getter:
          q: "HORizontal:MODE?"
          r: "{}"
        setter:
          q: "HORizontal:MODE {}"
      record_length:
        # the record length in samples (<NR1>)
        default: "1000000"
        getter:
          q: "HORizontal:MODE:RECOrdlength?"
          r: "{}"
        setter:
          q: "HORizontal:MODE:RECOrdlength {}"
      waveform_horizontal_units:
        getter:
          q: "WFMOutpre:XUNit?"
          r: "s"
      waveform_vertical_units:
        getter:
          q: "WFMOutpre:YUNit?"
          r: "V"
      data_source_ch1:
        getter:
          q: "DATa:SOU?"
          r: "CH1"
        setter:
          q: "DATa:SOU {}"
      measurement_type:
        getter:
          q: "MEASUrement:MEAS1:TYPe?"
          r: "amplitude"
        setter:
          q: "MEASUrement:MEAS1:TYPe {}"
      measurement_value:
        getter:
          q: "MEASUrement:MEAS1:VALue?"
          r: 0.1
      measurement1_source1:
        getter:
          q: "MEASUrement:MEAS1:SOUrce1?"
          r: "CH1"
        setter:
          q: "MEASUrement:MEAS1:SOUrce1 {}"
      measurement1_source2:
        getter:
          q: "MEASUrement:MEAS1:SOUrce2?"
          r: "CH1"
        setter:
          q: "MEASUrement:MEAS1:SOUrce2 {}"
      adjust_measurement_type_meas_1:
        setter:
          q: "MEASUrement:MEAS1:TYPe amplitude"
      adjust_measurement_type_meas_2:
        setter:
          q: "MEASUrement:MEAS2:TYPe frequency"
      get_measurement_value_mean_1:
        getter:
          q: "MEASUrement:MEAS1:VALue?"
          r: "0.01"
      get_measurement_value_mean_2:
        getter:
          q: "MEASUrement:MEAS2:VALue?"
          r: "0.01"
      measurement1_state:
        getter:
          q: "MEASUrement:MEAS1:STATe?"
          r: "1"
        setter:
          q: "MEASUrement:MEAS1:STATe {}"
      measurement2_state:
        getter:
          q: "MEASUrement:MEAS2:STATe?"
          r: "{}"
        setter:
          q: "MEASUrement:MEAS2:STATe {}"
      get_measurement1_mean:
        getter:
          q: "MEASUrement:MEAS1:MEAN?"
          r: "0.012"
      # waveform preamble of the DATa:SOUrce waveform, using the example
      # replies from the programmer manual
      waveform_y_multiplier:
        getter:
          q: "WFMOutPRE:YMULT?"
          r: "4.0000E-3"
      waveform_y_offset:
        # in digitizing levels
        getter:
          q: "WFMOutPRE:YOFF?"
          r: "-50.0000E+0"
      waveform_y_zero:
        getter:
          q: "WFMOutPRE:YZERO?"
          r: "-100.0000E-3"
      waveform_number_of_points:
        # kept short so tests can supply matching curve data
        getter:
          q: "WFMOutpre:NR_Pt?"
          r: "3"
      waveform_encoding:
        default: "ASCII"
        getter:
          q: "WFMOutpre:ENCdg?"
          r: "{}"
        setter:
          q: "WFMOutpre:ENCdg {}"
      waveform_binary_format:
        default: "RI"
        getter:
          q: "WFMOutpre:BN_Fmt?"
          r: "{}"
        setter:
          q: "WFMOutpre:BN_Fmt {}"
      waveform_bytes_per_sample:
        default: "1"
        getter:
          q: "WFMOutpre:BYT_Nr?"
          r: "{}"
        setter:
          q: "WFMOutpre:BYT_Nr {}"
      waveform_byte_order:
        default: "LSB"
        getter:
          q: "WFMOutpre:BYT_Or?"
          r: "{}"
        setter:
          q: "WFMOutpre:BYT_Or {}"


resources:
  "TCPIP0::0.0.0.0::inst0::INSTR":
    device: device 1
