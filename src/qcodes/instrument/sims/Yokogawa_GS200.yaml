spec: "1.0"
devices:
  device 1:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "QCoDeS Yokogawa Mock,GS200,xxxxxxxx,MOCKFW"
      - q: "*OPT?"
        r: "NO OPTIONS"

    properties:
      mode:
        default: "VOLT"
        getter:
          q: ":SOUR:FUNC?"
          r: "{}"
        setter:
          q: "SOUR:FUNC {}"
      output:
        default: 0
        getter:
          q: "OUTPUT?"
          r: "{}"
        setter:
          q: "OUTPUT {}"
      range:
        default: 10.0
        getter:
          q: ":SOUR:RANG?"
          r: "{:.6e}"
        setter:
          q: ":SOUR:RANG {}"
        specs:
          type: float
      level:
        default: 0.0
        getter:
          q: ":SOUR:LEV?"
          r: "{:.6e}"
        setter:
          q: ":SOUR:LEV {:e}"
        specs:
          type: float
      auto_level:
        default: 0.0
        setter:
          q: ":SOUR:LEV:AUTO {:e}"
        specs:
          type: float



resources:
  GPIB::1::INSTR:
     device: device 1
